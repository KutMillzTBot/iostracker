<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>KutMilzAi · Secure Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 20% 30%, #0b0b18, #030308);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Login Container */
        .login-container {
            background: rgba(20, 20, 35, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 28px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .login-container h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff2a6d, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-container .sub {
            text-align: center;
            color: #888;
            margin-bottom: 32px;
            font-size: 0.85rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.85rem;
            color: #ccc;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            background: #0b0b14;
            border: 1px solid #2a2a3a;
            border-radius: 28px;
            color: white;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff2a6d;
            box-shadow: 0 0 0 2px rgba(255, 42, 109, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff2a6d, #b0124a);
            border: none;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 16px;
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        .login-btn:disabled {
            opacity: 0.5;
            transform: none;
        }

        .error-message {
            background: rgba(255, 42, 109, 0.2);
            border-left: 3px solid #ff2a6d;
            padding: 12px 16px;
            border-radius: 16px;
            margin-top: 16px;
            font-size: 0.85rem;
            color: #ff6b9d;
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Dashboard (hidden initially) */
        .dashboard {
            display: none;
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: rgba(20, 20, 35, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 20px 22px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #ff2a6d;
            padding-left: 14px;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .badge {
            background: #1e1e2c;
            padding: 6px 14px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .toggle-btn {
            background: linear-gradient(135deg, #ff2a6d, #b0124a);
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 60px;
            font-size: 1rem;
            cursor: pointer;
        }

        .control {
            margin-bottom: 20px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        input[type="range"] {
            width: 100%;
            height: 5px;
            -webkit-appearance: none;
            background: #2c2c3a;
            border-radius: 10px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ff2a6d;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
        }

        select {
            background: #1e1e2c;
            border: 1px solid #3a3a4e;
            border-radius: 40px;
            padding: 10px 18px;
            color: white;
            font-size: 0.9rem;
            width: 100%;
        }

        .value-display {
            background: #00000055;
            padding: 4px 12px;
            border-radius: 30px;
            font-family: monospace;
        }

        button {
            background: #2c2c44;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 40px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
        }

        .logout-btn {
            background: #2a2a3a;
            margin-top: 0;
        }

        .footer {
            text-align: center;
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<!-- LOGIN FORM -->
<div id="loginContainer" class="login-container">
    <h1>⚡ KUTMILZ AI</h1>
    <div class="sub">Secure Aimbot Controller</div>
    
    <div class="input-group">
        <label>🔗 Backend API URL</label>
        <input type="text" id="apiUrl" placeholder="http://192.168.1.100:5000" value="http://localhost:5000">
    </div>
    
    <div class="input-group">
        <label>🔑 Authentication Token</label>
        <input type="password" id="token" placeholder="Enter your token">
    </div>
    
    <button class="login-btn" id="loginBtn">🔓 CONNECT & VERIFY</button>
    <div id="loginError" class="error-message"></div>
</div>

<!-- MAIN DASHBOARD (hidden until login) -->
<div id="dashboard" class="dashboard">
    <div class="card">
        <h2>⚡ KUTMILZ AI</h2>
        <div class="status-row">
            <span class="badge">🎯 Blood Strike</span>
            <span class="badge" id="liveStatus">● CONNECTED</span>
        </div>
        <button class="toggle-btn" id="toggleBtn">🔘 TOGGLE AIMBOT</button>
        <button class="logout-btn" id="logoutBtn" style="margin-top:10px; background:#2a2a3a;">🚪 DISCONNECT</button>
        <div style="font-size:0.75rem; margin-top:10px;">Hotkey: <strong>F7</strong> (keyboard)</div>
    </div>

    <div class="card">
        <h2>🎯 LOCK POINT</h2>
        <select id="aimPoint">
            <option value="head">🔴 Head (snap)</option>
            <option value="smoothhead">✨ Head (smooth)</option>
            <option value="chest">🟠 Chest (snap)</option>
            <option value="smoothchest">🌀 Chest (smooth)</option>
            <option value="leg">🟢 Leg (snap)</option>
            <option value="smoothleg">🌊 Leg (smooth)</option>
        </select>
    </div>

    <div class="card">
        <h2>⚙️ AIM STRENGTH</h2>
        <div class="control">
            <div class="control-header"><span>💪 Global Strength</span><span id="strengthVal" class="value-display">1.0</span></div>
            <input type="range" id="strength" min="0" max="2.0" step="0.05" value="1.0">
        </div>
        <div class="control">
            <div class="control-header"><span>🎚️ Aggressiveness</span><span id="aggVal" class="value-display">0.35</span></div>
            <input type="range" id="aggressiveness" min="0" max="1" step="0.01" value="0.35">
        </div>
        <div class="control">
            <div class="control-header"><span>🖱️ Max move/frame</span><span id="maxMoveVal" class="value-display">35</span></div>
            <input type="range" id="maxMove" min="5" max="80" step="1" value="35">
        </div>
        <div class="control">
            <div class="control-header"><span>🎯 Deadzone (px)</span><span id="deadzoneVal" class="value-display">10</span></div>
            <input type="range" id="deadzone" min="0" max="80" step="2" value="10">
        </div>
        <div class="control">
            <div class="control-header"><span>👁️ Aim FOV (radius)</span><span id="fovVal" class="value-display">300</span></div>
            <input type="range" id="aimFov" min="50" max="500" step="10" value="300">
        </div>
        <div class="control">
            <div class="control-header"><span>🌀 Randomness (jitter)</span><span id="randVal" class="value-display">0.05</span></div>
            <input type="range" id="randomness" min="0" max="0.3" step="0.01" value="0.05">
        </div>
        <button id="saveBtn">💾 SAVE ALL SETTINGS</button>
        <button id="testBtn" style="background:#3a86ff;">🔍 TEST LOCK (aim move)</button>
    </div>

    <div class="footer">
        KutMilzAi · Secure Remote Control
    </div>
</div>

<script>
    let apiBase = '';
    let authToken = '';

    // Helper: make authenticated API calls
    async function apiCall(endpoint, method = 'GET', body = null) {
        const url = `${apiBase}${endpoint}`;
        const headers = {
            'Content-Type': 'application/json',
            'X-Auth-Token': authToken
        };
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        
        try {
            const response = await fetch(url, options);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            return await response.json();
        } catch (e) {
            throw new Error(`Connection failed: ${e.message}`);
        }
    }

    // Login / Verification
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const apiUrl = document.getElementById('apiUrl').value.trim();
        const token = document.getElementById('token').value.trim();
        const errorDiv = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');
        
        // Reset error
        errorDiv.style.display = 'none';
        errorDiv.innerHTML = '';
        
        // Validate both fields filled
        if (!apiUrl || !token) {
            errorDiv.innerHTML = '❌ Both API URL and Token are required';
            errorDiv.style.display = 'block';
            return;
        }
        
        // Show loading
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<span class="spinner"></span> VERIFYING...';
        
        try {
            // Step 1: Test backend connection (ping /status endpoint)
            const testUrl = `${apiUrl}/status`;
            const testResponse = await fetch(testUrl, { method: 'GET' });
            if (!testResponse.ok) {
                throw new Error('Backend not responding');
            }
            
            // Step 2: Verify token by calling /verify endpoint
            const verifyResponse = await fetch(`${apiUrl}/verify`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            });
            
            if (!verifyResponse.ok) {
                throw new Error('Invalid token');
            }
            
            const verifyData = await verifyResponse.json();
            if (!verifyData.valid) {
                throw new Error('Authentication failed');
            }
            
            // Success! Store credentials and show dashboard
            apiBase = apiUrl;
            authToken = token;
            
            // Hide login, show dashboard
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            
            // Load current settings
            await loadSettings();
            
            // Start status polling
            startStatusPolling();
            
        } catch (err) {
            errorDiv.innerHTML = `❌ ${err.message}`;
            errorDiv.style.display = 'block';
        } finally {
            loginBtn.disabled = false;
            loginBtn.innerHTML = '🔓 CONNECT & VERIFY';
        }
    });
    
    // Logout
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
        apiBase = '';
        authToken = '';
        document.getElementById('loginContainer').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('loginContainer').style.opacity = '1';
    });
    
    // Load settings from server
    async function loadSettings() {
        try {
            const data = await apiCall('/status');
            document.getElementById('strength').value = data.strength || 1.0;
            document.getElementById('aggressiveness').value = data.aggressiveness || 0.35;
            document.getElementById('maxMove').value = data.max_move_per_frame || 35;
            document.getElementById('deadzone').value = data.deadzone || 10;
            document.getElementById('aimFov').value = data.aim_fov || 300;
            document.getElementById('randomness').value = data.randomness || 0.05;
            document.getElementById('aimPoint').value = data.aim_point || 'chest';
            document.getElementById('liveStatus').innerHTML = data.enabled ? '🟢 ACTIVE' : '⚫ INACTIVE';
            updateAllDisplays();
        } catch(e) {
            console.error('Failed to load settings:', e);
        }
    }
    
    function updateAllDisplays() {
        document.getElementById('strengthVal').innerText = document.getElementById('strength').value;
        document.getElementById('aggVal').innerText = document.getElementById('aggressiveness').value;
        document.getElementById('maxMoveVal').innerText = document.getElementById('maxMove').value;
        document.getElementById('deadzoneVal').innerText = document.getElementById('deadzone').value;
        document.getElementById('fovVal').innerText = document.getElementById('aimFov').value;
        document.getElementById('randVal').innerText = document.getElementById('randomness').value;
    }
    
    async function setSetting(key, value) {
        try {
            await apiCall('/set', 'POST', { key, value });
        } catch(e) { console.error(e); }
    }
    
    async function toggleAimbot() {
        try {
            await apiCall('/toggle', 'POST');
            const status = await apiCall('/status');
            document.getElementById('liveStatus').innerHTML = status.enabled ? '🟢 ACTIVE' : '⚫ INACTIVE';
        } catch(e) { console.error(e); }
    }
    
    async function testLock() {
        try {
            await apiCall('/test', 'POST');
        } catch(e) { alert('Test failed: ' + e.message); }
    }
    
    async function saveAllSettings() {
        const settings = {
            strength: parseFloat(document.getElementById('strength').value),
            aggressiveness: parseFloat(document.getElementById('aggressiveness').value),
            max_move_per_frame: parseInt(document.getElementById('maxMove').value),
            deadzone: parseInt(document.getElementById('deadzone').value),
            aim_fov: parseInt(document.getElementById('aimFov').value),
            randomness: parseFloat(document.getElementById('randomness').value),
            aim_point: document.getElementById('aimPoint').value
        };
        try {
            await Promise.all(Object.entries(settings).map(([k,v]) => setSetting(k, v)));
            alert('✅ Settings saved');
        } catch(e) { alert('❌ Save failed'); }
    }
    
    let statusInterval = null;
    function startStatusPolling() {
        if (statusInterval) clearInterval(statusInterval);
        statusInterval = setInterval(async () => {
            try {
                const status = await apiCall('/status');
                document.getElementById('liveStatus').innerHTML = status.enabled ? '🟢 ACTIVE' : '⚫ INACTIVE';
            } catch(e) { /* ignore */ }
        }, 3000);
    }
    
    // Event listeners for dashboard controls
    if (document.getElementById('strength')) {
        document.getElementById('strength').addEventListener('input', (e) => {
            document.getElementById('strengthVal').innerText = e.target.value;
            setSetting('strength', parseFloat(e.target.value));
        });
        document.getElementById('aggressiveness').addEventListener('input', (e) => {
            document.getElementById('aggVal').innerText = e.target.value;
            setSetting('aggressiveness', parseFloat(e.target.value));
        });
        document.getElementById('maxMove').addEventListener('input', (e) => {
            document.getElementById('maxMoveVal').innerText = e.target.value;
            setSetting('max_move_per_frame', parseInt(e.target.value));
        });
        document.getElementById('deadzone').addEventListener('input', (e) => {
            document.getElementById('deadzoneVal').innerText = e.target.value;
            setSetting('deadzone', parseInt(e.target.value));
        });
        document.getElementById('aimFov').addEventListener('input', (e) => {
            document.getElementById('fovVal').innerText = e.target.value;
            setSetting('aim_fov', parseInt(e.target.value));
        });
        document.getElementById('randomness').addEventListener('input', (e) => {
            document.getElementById('randVal').innerText = e.target.value;
            setSetting('randomness', parseFloat(e.target.value));
        });
        document.getElementById('aimPoint').addEventListener('change', (e) => {
            setSetting('aim_point', e.target.value);
        });
        document.getElementById('toggleBtn').addEventListener('click', toggleAimbot);
        document.getElementById('saveBtn').addEventListener('click', saveAllSettings);
        document.getElementById('testBtn').addEventListener('click', testLock);
    }
</script>
</body>
</html>
